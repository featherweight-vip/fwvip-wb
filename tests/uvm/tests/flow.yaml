
fragment:

  # --------------------------------------------------------------------------
  # UVM tests: the test class (fwvip_wb_test_base) plus the per-scenario DFM
  # entrypoints.
  #
  # Every test runs the same image + UVM test class (fwvip_wb_test_base); the
  # scenario is chosen by the +SEQ=<virtual-sequence> plusarg. Each task below
  # is one cell of the `uvm` suite below. Per-scenario knobs (e.g.
  # +NUM_TXNS, +BASE_ADDR) are plusargs.
  # --------------------------------------------------------------------------

  tasks:
  - name: uvm-tests-src
    uses: std.FileSet
    needs: [env]
    with:
      type: systemVerilogSource
      base: .
      incdirs: ["."]
      include: "*.sv"

  # The UVM suite. One cell per scenario; each is an hdlsim SimUVMCase: run
  # AND verdict, from the UVM report summary -- a UVM $finish exits 0 even
  # with UVM_ERROR>0, so the exit code is not the verdict. A failing cell does
  # not stop the others. Wired into `tests` and `tests-uvm` (flow.dv), so:
  #   dfm run tests-uvm                    # every UVM case
  #   dfm run tests --tests uvm.err        # one case
  #
  #   smoke  block of writes, then self-checked read-back
  #   write  write-only traffic
  #   read   reads of a preloaded target memory
  #   rand   random mix of reads and writes, checked by the scoreboard
  #   sel    byte-lane (sel) writes and read-back
  #   err    target ERR responses reach the initiator
  #   reg    UVM register model through the VIP's reg adapter
  - name: uvm
    strategy:
      matrix:
        case:
        - { name: smoke }
        - { name: write }
        - { name: read }
        - { name: rand }
        - { name: sel }
        - { name: err }
        - { name: reg }
    body:
    - name: "${{ this.case.name }}"
      uses: hdlsim.vlt.SimUVMCase    # pinned: see uvm-sim-img
      needs: [uvm-sim-img]
      with:
        name: "${{ this.case.name }}"
        testname: fwvip_wb_test_base
        plusargs: ["SEQ=fwvip_wb_vseq_${{ this.case.name }}"]
