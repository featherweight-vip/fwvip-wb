
fragment:
  
  tasks:
  - name: initiator-tb-hdlsrc
    uses: std.FileSet
    with:
      type: systemVerilogSource
      include: fwvip_wb_initiator_formal_tb.sv

  # The formal suite. Each cell is a formal.sby.Case: one SymbiYosys run
  # whose verdict (PASS / FAIL / UNKNOWN / ...) is a TestResult, so it is
  # selected and reported like any other case:
  #   dfm run tests-formal
  #   dfm run tests --tests formal.initiator-bmc
  # The target TB exists but is not proved yet.
  - name: formal
    strategy:
      matrix:
        case:
        - { name: initiator-bmc, top: fwvip_wb_initiator_formal_tb, mode: bmc }
    body:
    - name: "${{ this.case.name }}"
      uses: formal.sby.Case
      needs:
      - bus-macros
      - fw.proto.wb.xtor-core
      - fw.proto.wb.checker
      - initiator-tb-hdlsrc
      with:
        name: "${{ this.case.name }}"
        top: "${{ this.case.top }}"
        mode: "${{ this.case.mode }}"

