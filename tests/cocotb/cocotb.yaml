
fragment:

  tasks:
  # ----------------------------------------------------------------------
  # cocotb suite: the initiator/target/monitor cores wired in a plain Verilog
  # top, driven from Python through the VIP's front-end (org.fwvip.wb).
  #
  # cocotb is a MODE the simulator runs in, so the simulator is the project's
  # `--sim` knob, as for every other image and run:
  #   dfm run tests-cocotb                 # on the default simulator (vlt)
  #   dfm run tests-cocotb --sim ivl       # on Icarus
  #
  # The top drives TOP-LEVEL reg/logic signals (init_*/tgt_*/mon_*), not
  # sub-instance core ports, which works on both Verilator and Icarus. (Driving
  # sub-instance input ports works on Icarus but NOT Verilator, which
  # recomputes them each eval; see the backend docstring.)
  # ----------------------------------------------------------------------
  - name: cocotb-tb-src
    uses: std.FileSet
    with:
      type: systemVerilogSource
      base: .
      include: ["fwvip_wb_cocotb_top.sv"]

  # What every case shares: the test module and the HDL toplevel. Each case
  # narrows it to its own test function.
  - name: cocotb-testcfg
    uses: cocotb.TestConfig
    with:
      module: ["test_fwvip_wb"]
      toplevel: fwvip_wb_cocotb_top

  # cocotb's per-simulator pieces (GPI library, run-time env, and for
  # Verilator its C++ main). pythonpath makes the testbench module (this dir)
  # and the VIP front-end (src/python) importable at sim run time; the
  # simulator does NOT inherit the ambient PYTHONPATH, so both are listed.
  - name: cocotb-setup
    uses: cocotb.${{ sim }}.Setup
    with:
      pythonpath: [".", "../../src/python"]

  - name: cocotb-img
    uses: hdlsim.${{ sim }}.SimImage
    needs: [fw.proto.wb.xtor-core, cocotb-tb-src, cocotb-setup, flags-img]
    with:
      top: ["fwvip_wb_cocotb_top"]

  # The suite. One cell per cocotb test function; each is a cocotb.<sim>.Case
  # (run + verdict from results.xml), so a failing test never stops the
  # others and no results at all is an error, not a pass.
  #
  #   write_read  3 writes then 3 reads via the VIP front-end, checked
  #               through the monitor
  - name: cocotb
    strategy:
      matrix:
        case:
        - { name: write_read }
    body:
    - name: "${{ this.case.name }}"
      uses: cocotb.${{ sim }}.Case
      needs: [cocotb-img, cocotb-testcfg, "flags-run-${{ build }}"]
      with:
        name: "${{ this.case.name }}"
        testcase: ["test_wb_${{ this.case.name }}"]
