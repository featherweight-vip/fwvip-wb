
package:
  name: fwvip-wb
  default-dep-set: dev

  #  setup-deps:
  #- ninja
  #- cython

  dep-sets:
  - name: use
    deps:
    - { name: pyvsc, src: pypi }

  - { name: default-dev, uses: dev }
  - name: dev
    uses: use
    deps:
    - name: pytest
      src: pypi
    - name: click
      src: pypi
    - name: pyvsc
      url: https://github.com/fvutils/pyvsc.git
      branch: mballance/dv-solve
      dep-set: default-dev
    - name: fw-proto-wb
      url: https://github.com/featherweight-ip/fw-proto-wb.git
      dep-set: default-dev
    - name: fw-proto-uart
      url: https://github.com/featherweight-ip/fw-proto-uart.git
      dep-set: default-dev
    - name: fwvip-uart
      url: https://github.com/featherweight-vip/fwvip-uart.git
      dep-set: default-dev
    - name: pyhdl-if
      url: https://github.com/fvutils/pyhdl-if.git
      dep-set: default-dev
    - name: pytest-dfm
      url: https://github.com/dv-flow/pytest-dfm.git
      dep-set: default-dev
    - name: dv-flow-libcocotb
      url: https://github.com/dv-flow/dv-flow-libcocotb.git
      dep-set: default-dev
    - name: dv-flow-libhdlsim
      url: https://github.com/dv-flow/dv-flow-libhdlsim.git
      dep-set: default-dev
    - name: dv-flow-libformal
      url: https://github.com/dv-flow/dv-flow-libformal.git
      dep-set: default-dev
    # The project archetype flow.dv inherits (`uses: project.dv.uvm`): the
    # tests / smoke / tests-info entrypoints and the --sim/--build/--cov knobs.
    - name: dv-flow-libproject
      url: https://github.com/dv-flow/dv-flow-libproject.git
      dep-set: default-dev
    - name: fwvip-core
      url: https://github.com/featherweight-vip/fwvip-core.git
      dep-set: default-dev
    - name: iverilog
      src: gh-rls 
      url: https://github.com/edapack/iverilog-bin
    - name: cocotb
      src: pypi

  - name: default
    # fwprotocol-defs was removed: the only thing the VIP used from it was the
    # Wishbone/RV testbench macros, now vendored locally under src/macros
    # (exported as the `bus-macros` FileSet). The core transactor itself comes
    # from fw-proto-wb (default-dev).
    deps: []

  
  paths:
    project:
      lib-dirs:
      - tests
      - src
    export:
      lib-dirs:
      - src
      




